spring:
  application:
    name: rippleguard-governance-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/rippleguard_governance}
    username: ${DB_USERNAME:rippleguard_governance}
    password: ${DB_PASSWORD:change-me-governance-local}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:rippleguard-governance-service}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  health:
    kafka:
      enabled: true

rippleguard:
  contracts:
    repository: dlsrnjs125/rippleguard-contracts
    commit: 29f6c348fd93633476438ee36b3f93a3d036e165
    event-schema-version: 1.1.0
  loan:
    repository: dlsrnjs125/rippleguard-loan-service
    commit: 54ea344a682723d61d9beedf4ade56ee48029c0d
  kafka:
    enabled: ${GOVERNANCE_KAFKA_ENABLED:true}
    topics:
      loan-application-submitted: ${TOPIC_LOAN_APPLICATION_SUBMITTED:loan.application.submitted.v1}
  outbox:
    batch-size: ${OUTBOX_BATCH_SIZE:50}
    lease-seconds: ${OUTBOX_LEASE_SECONDS:60}
    instance-id: ${OUTBOX_INSTANCE_ID:${HOSTNAME:governance-service-local}}
