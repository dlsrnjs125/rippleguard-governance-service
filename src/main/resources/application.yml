spring:
  application:
    name: rippleguard-governance-service
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:rippleguard-governance-service}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  health:
    kafka:
      enabled: true

rippleguard:
  contracts:
    repository: dlsrnjs125/rippleguard-contracts
    commit: 5781bd30f688c25ae0d531049d6d7fb39ec3e9b1
    event-schema-version: 1.1.0
    root: ${CONTRACTS_ROOT}
  loan:
    repository: dlsrnjs125/rippleguard-loan-service
    commit: 1f78f8c3358fc0437b15f7b32ae8b2d4028a4800
  loan-service:
    base-url: ${LOAN_SERVICE_BASE_URL}
    feature-snapshots-path-template: ${LOAN_SERVICE_FEATURE_SNAPSHOTS_PATH_TEMPLATE:/internal/api/v1/loan-applications/{applicationId}/phase2-feature-snapshots/{snapshotVersion}}
    service-token: ${LOAN_SERVICE_INTERNAL_TOKEN}
    connect-timeout: ${LOAN_SERVICE_CONNECT_TIMEOUT:2s}
    response-timeout: ${LOAN_SERVICE_RESPONSE_TIMEOUT:5s}
  kafka:
    enabled: ${GOVERNANCE_KAFKA_ENABLED:true}
    topics:
      loan-application-submitted: ${TOPIC_LOAN_APPLICATION_SUBMITTED:loan.application.submitted.v1}
  outbox:
    batch-size: ${OUTBOX_BATCH_SIZE:50}
    lease-seconds: ${OUTBOX_LEASE_SECONDS:60}
    instance-id: ${OUTBOX_INSTANCE_ID:${HOSTNAME:governance-service-local}}
  agent-runtime:
    enabled: ${AGENT_RUNTIME_ENABLED:true}
    base-url: ${AGENT_RUNTIME_BASE_URL}
    loan-decision-runs-path: ${AGENT_RUNTIME_LOAN_DECISION_RUNS_PATH:/internal/v1/loan-decision-agent/runs}
    connect-timeout: ${AGENT_RUNTIME_CONNECT_TIMEOUT:2s}
    response-timeout: ${AGENT_RUNTIME_RESPONSE_TIMEOUT:10s}
    max-response-bytes: ${AGENT_RUNTIME_MAX_RESPONSE_BYTES:1048576}
  phase2:
    execution-plan:
      plan-version: ${PHASE2_EXECUTION_PLAN_VERSION}
      feature-schema-version: ${PHASE2_FEATURE_SCHEMA_VERSION}
      preprocessing-version: ${PHASE2_PREPROCESSING_VERSION}
      model-version: ${PHASE2_MODEL_VERSION}
      model-artifact-digest: ${PHASE2_MODEL_ARTIFACT_DIGEST}
      threshold-version: ${PHASE2_THRESHOLD_VERSION}
      max-attempts: ${AGENT_RUNTIME_MAX_ATTEMPTS:2}
      planning-recovery-attempts: ${PHASE2_PLANNING_RECOVERY_ATTEMPTS:5}
      request-timeout: ${AGENT_RUNTIME_REQUEST_TIMEOUT:30s}
      retry-backoff: ${AGENT_RUNTIME_RETRY_BACKOFF:2s}
      planning-recovery-backoff: ${PHASE2_PLANNING_RECOVERY_BACKOFF:25ms}
      lease-duration: ${AGENT_RUNTIME_LEASE_DURATION:30s}
