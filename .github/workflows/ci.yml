name: Governance CI

on:
  pull_request:
  push:
    branches:
      - main
      - "phase/**"

jobs:
  test-package-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout contracts
        uses: actions/checkout@v4
        with:
          repository: dlsrnjs125/rippleguard-contracts
          ref: 751f43c88c1bef860c76398eed24b3d60225b931
          path: rippleguard-contracts
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Test
        run: ./mvnw test
        env:
          CONTRACTS_ROOT: rippleguard-contracts
      - name: Package
        run: ./mvnw package
        env:
          CONTRACTS_ROOT: rippleguard-contracts
      - name: Docker build
        run: |
          image="rippleguard-governance-service:${GITHUB_SHA::12}"
          docker build \
            --build-arg "OCI_REVISION=${GITHUB_SHA}" \
            --build-arg "OCI_SOURCE=https://github.com/dlsrnjs125/rippleguard-governance-service" \
            -t "${image}" \
            .
      - name: Verify OCI labels
        run: |
          image="rippleguard-governance-service:${GITHUB_SHA::12}"
          revision="$(docker image inspect "${image}" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
          source="$(docker image inspect "${image}" --format '{{ index .Config.Labels "org.opencontainers.image.source" }}')"
          test "${revision}" = "${GITHUB_SHA}"
          test "${source}" = "https://github.com/dlsrnjs125/rippleguard-governance-service"
